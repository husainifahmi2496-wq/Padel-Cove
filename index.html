const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let M = [], K = [], P = [], tab = 'live', q = '';

};

function tglKey(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  if (isNaN(d.getTime())) return '';
  return d.toLocaleDateString('en-CA', { timeZone: 'Asia/Jakarta' }); // YYYY-MM-DD

function tglDefault() {

function renderDatebar() {

// G:A:1 -> Juara Grup A, W:BW-QF1 -> Pemenang QF1, L:BW-SF1 -> Kalah SF1

  if (x) return (x[1] === 'W' ? 'Pemenang ' : 'Kalah ') + x[2];

}

// Format jam HH:MM dari planned_start
function formatJam(ts) {
  if (!ts) return '';
  try {
    const d = new Date(ts);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleTimeString('id-ID', { timeZone: 'Asia/Jakarta', hour: '2-digit', minute: '2-digit', hour12: false });
  } catch (e) { return ''; }

// ====== PERKIRAAN JAM MULAI (hanya tampilan; jadwal resmi di database tidak berubah) ======
// Laga maju hanya jika laga sebelumnya di lapangan yang sama selesai lebih awal DAN slotnya rapat (tanpa jeda istirahat).
// Laga mundur jika laga sebelumnya, atau pasangan/laga penentu, belum selesai pada jamnya.
const DURASI_LAGA = 20;  // menit, perkiraan lama satu laga
const JEDA_LAGA   = 1;   // menit, jeda ganti pasangan di lapangan
const MAJU_MAKS   = 10;  // menit, batas maju dari jam resmi
const SLOT_RAPAT  = 5;   // menit, selisih maks. antara perkiraan selesai laga sebelumnya dan jam resmi agar dianggap rapat
const BEDA_MIN    = 3;   // menit, selisih minimum agar perkiraan ditampilkan
const BULAT_MENIT = 5;   // perkiraan dibulatkan ke kelipatan ini

function hitungEstimasi() {
  const MS = 60000, now = Date.now();
  const SELESAI = ['finished', 'walkover', 'retired'];
  const urut = M.filter(m => m.ps).sort((a, b) => (new Date(a.ps) - new Date(b.ps)) || (a.id < b.id ? -1 : 1));
  const akhirLaga = {}, akhirPair = {}, lapTerakhir = {};
  urut.forEach(m => {
    m.est = ''; m.estArah = '';
    if (m.status === 'cancelled') return;
    const ps = new Date(m.ps).getTime();
    const mul = m.mul ? new Date(m.mul).getTime() : ps;
    let akhir;
    if (SELESAI.includes(m.status)) {
      akhir = m.fin ? new Date(m.fin).getTime() : mul + DURASI_LAGA * MS;
    } else if (m.status === 'live') {
      akhir = Math.max(mul + DURASI_LAGA * MS, now);
    } else if (m.status === 'awaiting_confirmation') {
      akhir = now;
    } else {
      // scheduled / ready: belum dimulai
      const kendala = [];
      [[m.p1c, m.s1], [m.p2c, m.s2]].forEach(([kode, src]) => {
        if (kode) { if (akhirPair[kode]) kendala.push(akhirPair[kode]); return; }
        if (/^[WL]:/.test(src || '') && akhirLaga[src.slice(2)]) kendala.push(akhirLaga[src.slice(2)]);
      });
      const lap = lapTerakhir[m.lapEst];
      if (lap) kendala.push(lap.akhir);
      let est = ps;
      if (lap && m.p1c && m.p2c && ps - lap.planEnd <= SLOT_RAPAT * MS && lap.akhir < lap.planEnd) {
        est = ps + Math.max(lap.akhir - lap.planEnd, -MAJU_MAKS * MS);
      }
      kendala.forEach(k => { est = Math.max(est, k + JEDA_LAGA * MS); });
      est = Math.max(est, now);
      akhir = est + DURASI_LAGA * MS;
      if (Math.abs(est - ps) >= BEDA_MIN * MS) {
        m.est = formatJam(Math.round(est / (BULAT_MENIT * MS)) * BULAT_MENIT * MS);
        m.estArah = est > ps ? 'telat' : 'maju';
      }
    }
    akhirLaga[m.id] = akhir;
    if (m.lapEst) lapTerakhir[m.lapEst] = { akhir, planEnd: ps + DURASI_LAGA * MS };
    [m.p1c, m.p2c].forEach(k => { if (k) akhirPair[k] = akhir; });
  });
}

let fetching = false, fetchLagi = false, lastPairs = 0, lastUpd = '';

async function fetchData() {
  if (fetching) { fetchLagi = true; return; }
  fetching = true;
  try {
    const ambilPairs = !P.length || Date.now() - lastPairs > 600000;
    const [resM, resS, resK, resP] = await Promise.all([
      fetch(`${SUPA_URL}/rest/v1/matches?select=code,category_code,match_type,round_code,group_code,pair1_code,pair2_code,pair1_source,pair2_source,status,games1,games2,assigned_court,planned_court,planned_start,started_at,finished_at&order=planned_start.asc.nullslast,code.asc`, { headers: HEADERS }),
      fetch(`${SUPA_URL}/rest/v1/match_state?select=match_code,games1,games2,display1,display2`, { headers: HEADERS }),
      fetch(`${SUPA_URL}/rest/v1/v_klasemen_publik?select=*`, { headers: HEADERS }),
      ambilPairs ? fetch(`${SUPA_URL}/rest/v1/pairs?select=code,player1,player2,category_code,group_code`, { headers: HEADERS }) : null
    ]);

    if (!resM.ok || !resS.ok || !resK.ok || (resP && !resP.ok)) {
      throw new Error('Gagal mengambil data dari salah satu tabel Supabase.');
    }

    const matches = await resM.json();
    const states = await resS.json();
    K = await resK.json();
    if (resP) { P = await resP.json(); lastPairs = Date.now(); }

    const stateMap = {};
    states.forEach(s => stateMap[s.match_code] = s);

    M = matches.map(m => {
      const st = stateMap[m.code];
      const nama1 = P.find(x => x.code === m.pair1_code);
      const nama2 = P.find(x => x.code === m.pair2_code);

      return {
        id: m.code, kat: m.category_code, babak: labelBabak(m),
        p1: nama1 ? `${nama1.player1} / ${nama1.player2}` : (m.pair1_code || labelSumber(m.pair1_source)),
        p2: nama2 ? `${nama2.player1} / ${nama2.player2}` : (m.pair2_code || labelSumber(m.pair2_source)),
        lap: m.assigned_court || '-', 
        lapEst: m.assigned_court || m.planned_court || '',
        ps: m.planned_start, mul: m.started_at, fin: m.finished_at,
        p1c: m.pair1_code, p2c: m.pair2_code, s1: m.pair1_source, s2: m.pair2_source,
        status: m.status,
        g1: m.status === 'finished' ? m.games1 : (st ? st.games1 : 0),
        g2: m.status === 'finished' ? m.games2 : (st ? st.games2 : 0),
        d1: st ? st.display1 : '', d2: st ? st.display2 : '',
        live: m.status === 'live',
        jam: formatJam(m.planned_start),
        tgl: tglKey(m.planned_start)
      };
    });

    hitungEstimasi();
    render();
    lastUpd = 'Diperbarui ' + jam();
    tampilStatus();
  } catch (e) {
    console.error("Error fetching data:", e);
    $('#upd').textContent = 'Gagal memuat data, mencoba lagi…';
  } finally {
    fetching = false;
    if (fetchLagi) { fetchLagi = false; fetchData(); }
  }
}

const jam = () => new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

// ====== REALTIME ======
let sb = null, kanal = null, rtOk = false, pollTimer = null, tidurTimer = null, segarTimer = null;

function tampilStatus() {
  if (!lastUpd) return;
  $('#upd').textContent = lastUpd + (rtOk ? ' · skor live ⚡' : ' · diperbarui tiap 15 detik');
}

function jadwalkanPoll() {
  clearTimeout(pollTimer);
  pollTimer = setTimeout(async () => {
    if (!document.hidden) await fetchData();
    jadwalkanPoll();
  }, rtOk ? 60000 : 15000);
}

function segarkanSegera(ms = 1500) {
  clearTimeout(segarTimer);
  segarTimer = setTimeout(fetchData, ms);
}

function setMode(ok) {
  if (rtOk !== ok) { rtOk = ok; jadwalkanPoll(); }
  tampilStatus();
}

function terapkanState(s) {
  if (!s || !s.match_code) return;
  const m = M.find(x => x.id === s.match_code);
  if (!m || !m.live) { segarkanSegera(); return; }
  m.g1 = s.games1; m.g2 = s.games2;
  m.d1 = s.display1 || ''; m.d2 = s.display2 || '';
  render();
  lastUpd = 'Diperbarui ' + jam();
  tampilStatus();
  if (!s.display1 && !s.display2) segarkanSegera();
}

function mulaiRealtime() {
  if (kanal) return;
  if (!window.supabase || !window.supabase.createClient) { setMode(false); return; }
  try {
    if (!sb) sb = window.supabase.createClient(SUPA_URL, SUPA_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
    kanal = sb.channel('skor-live')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'match_state' }, p => terapkanState(p.new))
      .subscribe(status => {
        if (status === 'SUBSCRIBED') { setMode(true); segarkanSegera(300); }
        else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') setMode(false);
      });
  } catch (e) {
    console.error('Realtime gagal:', e);
    kanal = null;
    setMode(false);
  }
}

function hentikanRealtime() {
  if (sb && kanal) sb.removeChannel(kanal);
  kanal = null;
  setMode(false);
}

document.addEventListener('visibilitychange', () => {
  clearTimeout(tidurTimer);
  if (document.hidden) {
    tidurTimer = setTimeout(hentikanRealtime, 120000);
  } else {
    mulaiRealtime();
    segarkanSegera(300);
  }
});

function card(m) {
  const s = m.status === 'finished' || m.status === 'live' ? [m.g1, m.g2] : null;
  const w = m.status === 'finished' ? (Number(m.g1) > Number(m.g2) ? 1 : 2) : 0;
  const when = m.status === 'finished' ? 'Selesai' : (m.live ? '<span class="badge">LIVE</span> ' : '') + 'Lap ' + esc(m.lap);
  const pt1 = m.d1 ? '<span class="pt">' + esc(m.d1) + '</span>' : '';
  const pt2 = m.d2 ? '<span class="pt">' + esc(m.d2) + '</span>' : '';
  const katLabel = KATEGORI_LABEL[m.kat] || m.kat;
  const jamHtml = (m.jam ? ' <span class="jam">⏰ ' + esc(m.jam) + '</span>' : '') +
    (m.est ? ' <span class="jam est ' + m.estArah + '" title="Perkiraan mulai">≈ ' + esc(m.est) + '</span>' : '');

  return '<div class="card' + (m.live ? ' live' : '') + '"><div class="meta"><span>' + esc(katLabel) + ' · ' + esc(m.babak) + jamHtml + '</span><span>' + when + '</span></div>' +
    '<div class="row' + (w == 1 ? ' win' : '') + '"><span>' + esc(m.p1) + '</span><b>' + (s ? esc(s[0]) : '') + '</b>' + pt1 + '</div>' +
    '<div class="row' + (w == 2 ? ' win' : '') + '"><span>' + esc(m.p2) + '</span><b>' + (s ? esc(s[1]) : '') + '</b>' + pt2 + '</div></div>';
}

const chips = (opts, cur, key) => '<div class="chips">' + opts.map(o => {
  const label = KATEGORI_LABEL[o] || o;
  return '<button class="chip' + (o === cur ? ' on' : '') + '" data-f="' + key + '" data-v="' + esc(o) + '">' + esc(label) + '</button>';
}).join('') + '</div>';

function overlayView() {
  const live = M.filter(m => m.live);
  const done = M.filter(m => m.status === 'finished').slice(0, Math.max(0, 3 - live.length));
  const list = live.concat(done).slice(0, 3);
  return list.map(card).join('') || '<p class="mu">Belum ada pertandingan.</p>';
}

const V = {
  live() {
    if (IS_OVERLAY) return overlayView();
    const a = M.filter(m => m.live);
    const n = M.filter(m => m.status === 'ready' || m.status === 'scheduled').slice(0, 6);
    const r = M.filter(m => m.status === 'finished').reverse().slice(0, 6);

    return '<h2>Sedang berlangsung</h2>' + (a.map(card).join('') || '<p class="mu">Belum ada pertandingan yang berlangsung.</p>') +
      '<h2>Pertandingan berikutnya</h2>' + (n.map(card).join('') || '<p class="mu">Tidak ada jadwal berikutnya.</p>') + (n.some(m => m.est) ? '<p class="mu">⏰ = jam resmi. ≈ = perkiraan mulai menurut laga sebelumnya di lapangan yang sama; bisa berubah.</p>' : '') +
      '<h2>Hasil terbaru</h2>' + (r.map(card).join('') || '<p class="mu">Belum ada hasil.</p>');
  },
  klas() {
    if (!K.length) return '<p class="mu">Belum ada data klasemen.</p>';
    const KAT = [...new Set(K.map(k => k.category_code))];
    
    if (!filterKat || !KAT.includes(filterKat)) filterKat = KAT[0];

    let html = '';

    const grupMap = {};
    K.filter(k => k.category_code === filterKat).forEach(k => {
      if (!grupMap[k.group_code]) grupMap[k.group_code] = [];
      grupMap[k.group_code].push(k);
    });

    for (const g in grupMap) {
      html += `<div class="card"><b>${esc(KATEGORI_LABEL[filterKat] || filterKat)} — Group ${esc(g)}</b><table><tr><th>#</th><th>Tim</th><th>M</th><th>W</th><th>L</th><th>Poin</th></tr>`;
      html += grupMap[g].map((r, i) => `<tr class="${i < 2 ? 'q' : ''}"><td>${i+1}</td><td>${esc(r.nama_pasangan)}</td><td>${r.main}</td><td>${r.menang}</td><td>${r.kalah}</td><td>${r.selisih_game}</td></tr>`).join('');
      html += `</table></div>`;
    }
    return html + '<p class="mu">M = main, W = menang, L = kalah, Poin = selisih game. Baris biru = zona lolos.</p>';
  },
  jadwal() {
    if (!filterTgl) filterTgl = tglDefault();
    const semua = M.filter(m => m.status === 'scheduled' || m.status === 'ready');
    const l = filterTgl === 'all' ? semua : semua.filter(m => m.tgl === filterTgl);
    const judul = filterTgl === 'all' ? 'Semua jadwal' : (NAMA_HARI[filterTgl] || filterTgl);
    return '<h2 class="dhead">' + esc(judul) + '<span>' + l.length + ' pertandingan</span></h2>' +
      (l.map(card).join('') || '<p class="mu">Belum ada jadwal di tanggal ini.</p>') + (l.some(m => m.est) ? '<p class="mu">⏰ = jam resmi. ≈ = perkiraan mulai menurut laga sebelumnya di lapangan yang sama; bisa berubah.</p>' : '');
  },
  cari() { return '<input id="q" type="search" placeholder="Ketikan nama pemain" value="' + esc(q) + '" autocomplete="off"><div id="hs"></div>'; }
};

function hasilCari() {
  const t = q.trim().toLowerCase(), box = $('#hs'); if (!box) return;
  if (t.length < 2) { box.innerHTML = ''; return; }
  
  const filtered = P.filter(r => (r.player1 + ' ' + r.player2 + ' ' + r.code).toLowerCase().includes(t));
  box.innerHTML = filtered.slice(0, 12).map(r => {
    const nama = r.player1 + ' / ' + r.player2;
    const laga = M.filter(m => m.p1 === nama || m.p2 === nama).map(card).join('');
    return `<h2>${esc(nama)}</h2><p class="mu">${esc(KATEGORI_LABEL[r.category_code] || r.category_code)} · Group ${esc(r.group_code || '-')} · ${esc(r.code)}</p>` + (laga || '<p class="mu">Belum ada jadwal.</p>');
  }).join('') || '<p class="mu">Pemain tidak ditemukan.</p>';
}

// ====== LOGIKA RENDER SPONSOR BERDASARKAN TAB ======
function sesuaikanPadding() {
  const sp = document.querySelector('.spons');
  if (sp) document.body.style.setProperty('--spons-h', sp.offsetHeight + 'px');
}
window.addEventListener('resize', sesuaikanPadding);

let sponsTab = null, sponsTimer = null, sponsPage = 0;
const SPONS_DETIK = 5; // jeda pergantian logo (detik)
const EKS = ['png', 'jpg', 'jpeg', 'webp', 'svg', 'PNG', 'JPG', 'JPEG'];

// Daftar file yang dicoba berurutan sampai ada yang berhasil dimuat
function kandidatLogo(logo) {
  const bases = [logo.src.replace(/\.[^.\/]+$/, '')].concat(logo.alt || []);
  const out = [logo.src];
  bases.forEach(b => EKS.forEach(e => { const f = b + '.' + e; if (!out.includes(f)) out.push(f); }));
  return out;
}

// Jika semua kandidat gagal, tampilkan nama sponsor sebagai teks
function logoGagal(img) {
  const list = JSON.parse(img.dataset.c || '[]');
  const i = Number(img.dataset.i || 0) + 1;
  if (i < list.length) { img.dataset.i = i; img.src = list[i]; return; }
  const span = document.createElement('span');
  span.className = 'spons-txt';
  span.textContent = img.alt;
  img.replaceWith(span);
  sesuaikanPadding();
}

function tampilHalamanSponsor(data, idx) {
  const gridEl = $('#spons-grid');
  if (!gridEl) return;
  const per = data.cols;
  const potong = data.logos.slice(idx * per, idx * per + per);
  gridEl.innerHTML = potong.map(logo => `
    <div class="spons-item">
      <img src="${logo.src}" alt="${esc(logo.name)}" data-i="0" data-c="${esc(JSON.stringify(kandidatLogo(logo)))}" onload="sesuaikanPadding()" onerror="logoGagal(this)">
    </div>
  `).join('');
  sesuaikanPadding();
}

function renderSponsor(halaman) {
  const gridEl = $('#spons-grid');
  if (!gridEl) return;
  if (sponsTab === halaman) return; // jangan reset rotasi setiap skor berubah
  sponsTab = halaman;

  clearInterval(sponsTimer);
  const data = SPONSOR_MAP[halaman] || SPONSOR_MAP['live'];
  gridEl.className = `spons-grid cols-${data.cols}`;

  // Sekali tampil sebanyak jumlah kolom (klasemen 3 logo, cari pemain 4 logo)
  const jmlHalaman = Math.ceil(data.logos.length / data.cols);
  sponsPage = 0;
  tampilHalamanSponsor(data, 0);

  if (jmlHalaman > 1) {
    sponsTimer = setInterval(() => {
      gridEl.classList.add('fade');
      setTimeout(() => {
        sponsPage = (sponsPage + 1) % jmlHalaman;
        tampilHalamanSponsor(data, sponsPage);
        gridEl.classList.remove('fade');
      }, 350);
    }, SPONS_DETIK * 1000);
  }
}
// ====================================================

function render() {
  if (IS_OVERLAY) {
    tab = 'live';
    const nav = $('#nav'); if (nav) nav.style.display = 'none';
    $('#view').innerHTML = V.live();
    return;
  }
  $('#nav').innerHTML = TABS.map(t => '<button class="' + (t[0] === tab ? 'on' : '') + '" data-t="' + t[0] + '">' + t[1] + '</button>').join('');

  renderSponsor(tab);
  renderDatebar();

  if (tab === 'cari' && $('#q')) return hasilCari();
  if (!animDir) $('#view').classList.remove('ganti');
  $('#view').innerHTML = V[tab]();
  animasiGanti();
  if (tab === 'cari') hasilCari();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-t],[data-f],[data-d]'); if (!el) return; const d = el.dataset;
  if (d.t) { tab = d.t; return render(); }

  if (d.d) {
    if (d.d === filterTgl) return;
    const lama = HARI.findIndex(h => h[0] === filterTgl);
    const baru = HARI.findIndex(h => h[0] === d.d);
    animDir = baru > lama ? 1 : -1;
    filterTgl = d.d;
    return render();
  }

  if (d.f === 'kat') {
    if (d.v === filterKat) return;
    const arr = daftarKat();
    animDir = arr.indexOf(d.v) > arr.indexOf(filterKat) ? 1 : -1;
    filterKat = d.v;
    return render();
  }
});
// Render awal & polling
render();
fetchData();
mulaiRealtime();
jadwalkanPoll();
</script>
