  <link rel="icon" type="image/png" href="/favicon.png">

<style>
:root{--navy:#0a2a7a;--lime:#c5f544;--limed:#5c8a00;--card:rgba(8,32,100,.55);--tx:#fff;--mu:#b8cdf5;--ac:var(--lime);--ac2:rgba(197,245,68,.18);--bd:rgba(255,255,255,.16);--lv:#ff5a5f;--fh:'Unbounded','Arial Black',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(180deg,#2f78ea 0,#1448b8 40%,#0b2b84 100%) fixed;min-height:100vh;padding-top:env(safe-area-inset-top)}
header{padding:16px 16px 6px;max-width:760px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
#logo{height:80px;max-width:150px;object-fit:contain}
.pill{border:1.5px solid rgba(255,255,255,.55);border-radius:999px;padding:6px 14px;font:800 11px var(--fh);letter-spacing:.12em;background:rgba(255,255,255,.08)}
.tag{display:inline-block;background:var(--lime);color:var(--navy);border-radius:8px;padding:8px 16px;font:800 clamp(16px, 4.5vw, 24px) var(--fh);letter-spacing:.14em;line-height:1.2;margin-bottom:8px}
h1{margin:10px 0 4px;font:900 clamp(20px, 6.5vw, 34px)/.95 var(--fh);font-style:italic;text-transform:uppercase;text-shadow:0 2px 0 var(--navy)}
h1 em{display:block;color:var(--lime);text-shadow:0 2px 0 var(--limed)}
header small{color:var(--mu)}
.tape{overflow:hidden;white-space:nowrap;background:var(--lime);color:var(--navy);font:800 11px var(--fh);letter-spacing:.14em;padding:9px 0;transform:rotate(-1.6deg);margin:14px -8px 10px;box-shadow:0 3px 0 var(--navy)}
.tape span{display:inline-block;padding-left:16px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:rgba(8,30,95,.88);backdrop-filter:blur(8px);position:sticky;top:0;z-index:5}
nav button,.chip{border:1.5px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:999px;padding:8px 16px;font:700 12px var(--fh);letter-spacing:.04em;white-space:nowrap;cursor:pointer}
nav button.on,.chip.on{background:var(--lime);color:var(--navy);border-color:var(--lime)}
main{max-width:760px;margin:0 auto;padding:14px 12px}
h2{font:800 13px var(--fh);letter-spacing:.1em;text-transform:uppercase;color:var(--lime);margin:20px 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:12px 14px;margin-bottom:10px;backdrop-filter:blur(4px)}
.card.live{border:2px solid var(--lime);box-shadow:0 0 0 3px rgba(197,245,68,.2)}
.meta{display:flex;justify-content:space-between;gap:8px;color:var(--mu);font-size:11px;letter-spacing:.04em;margin-bottom:8px;text-transform:uppercase}
.meta .jam{display:inline-block;background:rgba(197,245,68,.15);color:var(--lime);border-radius:6px;padding:2px 8px;font-weight:700;letter-spacing:.04em}
.row{display:flex;justify-content:space-between;padding:3px 0;font-weight:600}.row b{font:800 20px var(--fh);min-width:26px;text-align:right}
.row.win{color:var(--lime)}
.badge{background:var(--lv);color:#fff;border-radius:6px;padding:2px 8px;font:800 10px var(--fh)}
table{width:100%;border-collapse:collapse;font-size:13px}th{color:var(--mu);font-size:11px}th,td{padding:7px 4px;text-align:center;border-bottom:1px solid var(--bd)}th:nth-child(3),td:nth-child(3){text-align:left}
tr.q td{background:var(--ac2)}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
input,select{width:100%;padding:12px 16px;border:0;border-radius:999px;background:#fff;color:var(--navy);font:600 15px system-ui;margin-bottom:12px}
.mu{color:var(--mu)}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:999px;background:var(--lime);color:var(--navy);font:800 12px var(--fh);letter-spacing:.08em;text-transform:uppercase;margin-top:10px;cursor:pointer;box-shadow:0 4px 0 var(--limed)}
a{color:var(--lime)}
footer{text-align:center;color:var(--mu);font-size:12px;padding:8px 8px calc(18px + env(safe-area-inset-bottom))}
.pt{background:var(--lime);color:var(--navy);border-radius:8px;padding:2px 8px;margin-left:8px;font:800 12px var(--fh);min-width:36px;text-align:center}
.row{align-items:center}.row span:first-child{flex:1}

/* ====== SPONSOR AUTO-SCROLL & GRID ====== */
.spons{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:736px;margin:0 auto;padding:12px 14px calc(12px + env(safe-area-inset-bottom));text-align:center;background:#fff;border-radius:16px 16px 0 0;color:var(--navy);box-shadow:0 -4px 16px rgba(0,0,0,.25); transition: padding 0.3s ease;}
body{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
.spons-title{font:800 11px var(--fh);letter-spacing:.14em;color:var(--navy);text-transform:uppercase;margin-bottom:12px;height:16px; display: none;} /* Tulisan GOLD SPONSOR dihilangkan */
.spons-grid{display:grid;gap:8px;margin-bottom:12px;min-height:60px; align-content:center; transition: opacity 0.3s ease;}
.spons-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
.spons-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
.spons-grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
.spons-item{display:flex;align-items:center;justify-content:center;background:#f8faff;border:1.5px dashed #ccd9f0;border-radius:12px;padding:12px 8px;height:100%;min-height:54px;}
.spons-item img{max-width:100%;max-height:32px;object-fit:contain;}
/* Animasi Fade */
.fade-out { opacity: 0; }
.fade-in { opacity: 1; }
/* Indikator Halaman */
.spons-dots{display:flex;justify-content:center;gap:6px;margin-top:4px;}
.dot{width:6px;height:6px;border-radius:50%;background:#ccd9f0;transition:background 0.3s;}
.dot.active{background:var(--navy);}

/* ====== MODE OVERLAY (Live Streaming) ====== */
body.overlay-mode{background:transparent !important;padding-top:0;padding-bottom:0}
body.overlay-mode header,
body.overlay-mode .tape,
body.overlay-mode nav,
body.overlay-mode footer,
body.overlay-mode .spons{display:none !important}
body.overlay-mode main{padding:6px;max-width:640px;margin:0}
body.overlay-mode .card{background:rgba(4,18,60,.72);border:2px solid rgba(197,245,68,.8);box-shadow:0 4px 18px rgba(0,0,0,.5)}
body.overlay-mode .card .meta,
body.overlay-mode .card .row,
body.overlay-mode .card .row span,
body.overlay-mode .card .row b{text-shadow:0 1px 2px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,.8)}
body.overlay-mode h2{text-shadow:0 2px 4px rgba(0,0,0,.9)}
</style>

<!-- Supabase Realtime: skor live tanpa menunggu polling. Jika CDN gagal dimuat, halaman tetap jalan dengan polling 15 detik. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ====== KONFIGURASI SUPABASE ======
const SUPA_URL = 'https://toyfsmqgqmwxezcaxbhd.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRveWZzbXFncW13eGV6Y2F4YmhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0MDk5MjUsImV4cCI6MjEwOTk4NTkyNX0.Qcq-Ld9VUcOcGUxnagMlPiywAlgxB2-53O2n0ljzzNk';
const HEADERS = { 
  'apikey': SUPA_KEY,
  'Authorization': 'Bearer ' + SUPA_KEY,
  'Content-Type': 'application/json'
};
// ==================================

// ====== KONFIGURASI SPONSOR ======
const SPONSOR_SLIDES = [
  {
    title: 'GOLD SPONSOR',
    cols: 2,
    logos: [
      { src: 'sponsor/sponsor-10-mslemon.png', name: 'Ms Lemon' },
      { src: 'sponsor/sponsor-07-alina.png', name: 'Alina Beauty' }
    ]
  },
  {

    cols: 3,
    logos: [
      { src: 'sponsor/sponsor-05-reta.png', name: 'Reta Beauty Clinic' },
      { src: 'sponsor/sponsor-04-vato.png', name: 'Vato Coffee' },
      { src: 'sponsor/sponsor-01-exodus.png', name: 'Exodus' }
    ]
  },
  {
    title: 'FRIENDS OF COVE',
    cols: 3,
    logos: [
      { src: 'sponsor/sponsor-15-mandiri.png', name: 'Bank Mandiri' },
      { src: 'sponsor/sponsor-08-grab.png', name: 'Grab' },
      { src: 'sponsor/sponsor-17-grey.png', name: 'GREY Resto & Coffee' }
    ]
  },
  {
    title: 'OFFICIAL PARTNER',
    cols: 4,
    logos: [
      { src: 'sponsor/sponsor-06-fitbar.png', name: 'Fitbar' },
      { src: 'sponsor/sponsor-03-almoz.png', name: 'Almoz' },
      { src: 'sponsor/sponsor-13-cola.png', name: 'Colave' },
      { src: 'sponsor/sponsor-16-aqua.png', name: 'Aqua' }
    ]
  }
];
let currentSlide = 0;
let sponsorInterval = null;
// =================================

// ====== MODE OVERLAY ======
const params = new URLSearchParams(location.search);
const IS_OVERLAY = params.get('overlay') === '1' || params.get('mode') === 'overlay';
if (IS_OVERLAY) document.body.classList.add('overlay-mode');
// ==========================

const TABS = [['live', 'Live'], ['klas', 'Klasemen'], ['jadwal', 'Jadwal'], ['cari', 'Cari Pemain']];
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let M = [], K = [], P = [], tab = 'live', q = '';

const KATEGORI_LABEL = {
  'BW': "Women's Beginner",
  'LB': 'Lower Bronze Mix',
  'MB': "Men's Bronze"
};
let filterKat = null; 

// G:A:1 -> Juara Grup A, W:BW-QF1 -> Pemenang QF1, L:BW-SF1 -> Kalah SF1
function labelSumber(src) {
  if (!src) return 'TBD';
  let x = /^G:([A-P]):(\d+)$/.exec(src);
  if (x) return (x[2] === '1' ? 'Juara' : x[2] === '2' ? 'Runner-up' : 'Peringkat ' + x[2]) + ' Grup ' + x[1];
  x = /^([WL]):[A-Z]+-(.+)$/.exec(src);
  if (x) return (x[1] === 'W' ? 'Pemenang ' : 'Kalah ') + x[2];
  return src;
}
const BABAK = { QF: 'Perempat Final', SF: 'Semifinal', '3RD': 'Perebutan Juara 3', FIN: 'Final' };
function labelBabak(m) {
  if (m.match_type === 'group') return 'Group ' + m.group_code;
  const n = (/(\d+)$/.exec(m.code) || [])[1];
  return (BABAK[m.round_code] || m.round_code) + (n && m.round_code !== '3RD' ? ' ' + n : '');
}

// Format jam HH:MM dari planned_start
function formatJam(ts) {
  if (!ts) return '';
  try {
    const d = new Date(ts);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', hour12: false });
  } catch (e) { return ''; }
}

let fetching = false, fetchLagi = false, lastPairs = 0, lastUpd = '';

async function fetchData() {
  if (fetching) { fetchLagi = true; return; }
  fetching = true;
  try {
    const ambilPairs = !P.length || Date.now() - lastPairs > 600000;
    const [resM, resS, resK, resP] = await Promise.all([
      fetch(`${SUPA_URL}/rest/v1/matches?select=code,category_code,match_type,round_code,group_code,pair1_code,pair2_code,pair1_source,pair2_source,status,games1,games2,assigned_court,planned_start&order=planned_start.asc.nullslast,code.asc`, { headers: HEADERS }),
      fetch(`${SUPA_URL}/rest/v1/match_state?select=match_code,games1,games2,display1,display2`, { headers: HEADERS }),
      fetch(`${SUPA_URL}/rest/v1/v_klasemen_publik?select=*`, { headers: HEADERS }),
      ambilPairs ? fetch(`${SUPA_URL}/rest/v1/pairs?select=code,player1,player2,category_code,group_code`, { headers: HEADERS }) : null
    ]);

    if (!resM.ok || !resS.ok || !resK.ok || (resP && !resP.ok)) {
      throw new Error('Gagal mengambil data dari salah satu tabel Supabase.');
    }

    const matches = await resM.json();
    const states = await resS.json();
    K = await resK.json();
    if (resP) { P = await resP.json(); lastPairs = Date.now(); }

    const stateMap = {};
    states.forEach(s => stateMap[s.match_code] = s);

    M = matches.map(m => {
      const st = stateMap[m.code];
      const nama1 = P.find(x => x.code === m.pair1_code);
      const nama2 = P.find(x => x.code === m.pair2_code);

      return {
        id: m.code, kat: m.category_code, babak: labelBabak(m),
        p1: nama1 ? `${nama1.player1} / ${nama1.player2}` : (m.pair1_code || labelSumber(m.pair1_source)),
        p2: nama2 ? `${nama2.player1} / ${nama2.player2}` : (m.pair2_code || labelSumber(m.pair2_source)),
        lap: m.assigned_court || '-', 
        status: m.status,
        g1: m.status === 'finished' ? m.games1 : (st ? st.games1 : 0),
        g2: m.status === 'finished' ? m.games2 : (st ? st.games2 : 0),
        d1: st ? st.display1 : '', d2: st ? st.display2 : '',
        live: m.status === 'live',
        jam: formatJam(m.planned_start)
      };
    });

    render();
    lastUpd = 'Diperbarui ' + jam();
    tampilStatus();
  } catch (e) {
    console.error("Error fetching data:", e);
    $('#upd').textContent = 'Gagal memuat data, mencoba lagi…';
  } finally {
    fetching = false;
    if (fetchLagi) { fetchLagi = false; fetchData(); }
  }
}

const jam = () => new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

// ====== REALTIME ======
let sb = null, kanal = null, rtOk = false, pollTimer = null, tidurTimer = null, segarTimer = null;

function tampilStatus() {
  if (!lastUpd) return;
  $('#upd').textContent = lastUpd + (rtOk ? ' · skor live ⚡' : ' · diperbarui tiap 15 detik');
}

function jadwalkanPoll() {
  clearTimeout(pollTimer);
  pollTimer = setTimeout(async () => {
    if (!document.hidden) await fetchData();
    jadwalkanPoll();
  }, rtOk ? 60000 : 15000);
}

function segarkanSegera(ms = 1500) {
  clearTimeout(segarTimer);
  segarTimer = setTimeout(fetchData, ms);
}

function setMode(ok) {
  if (rtOk !== ok) { rtOk = ok; jadwalkanPoll(); }
  tampilStatus();
}

function terapkanState(s) {
  if (!s || !s.match_code) return;
  const m = M.find(x => x.id === s.match_code);
  if (!m || !m.live) { segarkanSegera(); return; }
  m.g1 = s.games1; m.g2 = s.games2;
  m.d1 = s.display1 || ''; m.d2 = s.display2 || '';
  render();
  lastUpd = 'Diperbarui ' + jam();
  tampilStatus();
  if (!s.display1 && !s.display2) segarkanSegera();
}

function mulaiRealtime() {
  if (kanal) return;
  if (!window.supabase || !window.supabase.createClient) { setMode(false); return; }
  try {
    if (!sb) sb = window.supabase.createClient(SUPA_URL, SUPA_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
    kanal = sb.channel('skor-live')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'match_state' }, p => terapkanState(p.new))
      .subscribe(status => {
        if (status === 'SUBSCRIBED') { setMode(true); segarkanSegera(300); }
        else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') setMode(false);
      });
  } catch (e) {
    console.error('Realtime gagal:', e);
    kanal = null;
    setMode(false);
  }
}

function hentikanRealtime() {
  if (sb && kanal) sb.removeChannel(kanal);
  kanal = null;
  setMode(false);
}

document.addEventListener('visibilitychange', () => {
  clearTimeout(tidurTimer);
  if (document.hidden) {
    tidurTimer = setTimeout(hentikanRealtime, 120000);
  } else {
    mulaiRealtime();
    segarkanSegera(300);
  }
});

function card(m) {
  const s = m.status === 'finished' || m.status === 'live' ? [m.g1, m.g2] : null;
  const w = m.status === 'finished' ? (Number(m.g1) > Number(m.g2) ? 1 : 2) : 0;
  const when = m.status === 'finished' ? 'Selesai' : (m.live ? '<span class="badge">LIVE</span> ' : '') + 'Lap ' + esc(m.lap);
  const pt1 = m.d1 ? '<span class="pt">' + esc(m.d1) + '</span>' : '';
  const pt2 = m.d2 ? '<span class="pt">' + esc(m.d2) + '</span>' : '';
  const katLabel = KATEGORI_LABEL[m.kat] || m.kat;
  const jamHtml = m.jam ? ' <span class="jam">⏰ ' + esc(m.jam) + '</span>' : '';

  return '<div class="card' + (m.live ? ' live' : '') + '"><div class="meta"><span>' + esc(katLabel) + ' · ' + esc(m.babak) + jamHtml + '</span><span>' + when + '</span></div>' +
    '<div class="row' + (w == 1 ? ' win' : '') + '"><span>' + esc(m.p1) + '</span><b>' + (s ? esc(s[0]) : '') + '</b>' + pt1 + '</div>' +
    '<div class="row' + (w == 2 ? ' win' : '') + '"><span>' + esc(m.p2) + '</span><b>' + (s ? esc(s[1]) : '') + '</b>' + pt2 + '</div></div>';
}

const chips = (opts, cur, key) => '<div class="chips">' + opts.map(o => {
  const label = KATEGORI_LABEL[o] || o;
  return '<button class="chip' + (o === cur ? ' on' : '') + '" data-f="' + key + '" data-v="' + esc(o) + '">' + esc(label) + '</button>';
}).join('') + '</div>';

function overlayView() {
  const live = M.filter(m => m.live);
  const done = M.filter(m => m.status === 'finished').slice(0, Math.max(0, 3 - live.length));
  const list = live.concat(done).slice(0, 3);
  return list.map(card).join('') || '<p class="mu">Belum ada pertandingan.</p>';
}

const V = {
  live() {
    if (IS_OVERLAY) return overlayView();
    const a = M.filter(m => m.live);
    const n = M.filter(m => m.status === 'ready' || m.status === 'scheduled').slice(0, 6);
    const r = M.filter(m => m.status === 'finished').reverse().slice(0, 6);

    return '<h2>Sedang berlangsung</h2>' + (a.map(card).join('') || '<p class="mu">Belum ada pertandingan yang berlangsung.</p>') +
      '<h2>Pertandingan berikutnya</h2>' + (n.map(card).join('') || '<p class="mu">Tidak ada jadwal berikutnya.</p>') +
      '<h2>Hasil terbaru</h2>' + (r.map(card).join('') || '<p class="mu">Belum ada hasil.</p>');
  },
  klas() {
    if (!K.length) return '<p class="mu">Belum ada data klasemen.</p>';
    const KAT = [...new Set(K.map(k => k.category_code))];
    
    if (!filterKat || !KAT.includes(filterKat)) filterKat = KAT[0];

    let html = chips(KAT, filterKat, 'kat');

    const grupMap = {};
    K.filter(k => k.category_code === filterKat).forEach(k => {
      if (!grupMap[k.group_code]) grupMap[k.group_code] = [];
      grupMap[k.group_code].push(k);
    });

    for (const g in grupMap) {
      html += `<div class="card"><b>${esc(KATEGORI_LABEL[filterKat] || filterKat)} — Group ${esc(g)}</b><table><tr><th>#</th><th>Tim</th><th>M</th><th>W</th><th>L</th><th>Poin</th></tr>`;
      html += grupMap[g].map((r, i) => `<tr class="${i < 2 ? 'q' : ''}"><td>${i+1}</td><td>${esc(r.nama_pasangan)}</td><td>${r.main}</td><td>${r.menang}</td><td>${r.kalah}</td><td>${r.selisih_game}</td></tr>`).join('');
      html += `</table></div>`;
    }
    return html + '<p class="mu">M = main, W = menang, L = kalah, Poin = selisih game. Baris biru = zona lolos.</p>';
  },
  jadwal() {
    const l = M.filter(m => m.status === 'scheduled' || m.status === 'ready');
    return (l.map(card).join('') || '<p class="mu">Belum ada jadwal.</p>');
  },
  cari() { return '<input id="q" type="search" placeholder="Ketikan nama pemain" value="' + esc(q) + '" autocomplete="off"><div id="hs"></div>'; }
};

function hasilCari() {
  const t = q.trim().toLowerCase(), box = $('#hs'); if (!box) return;
  if (t.length < 2) { box.innerHTML = ''; return; }
  
  const filtered = P.filter(r => (r.player1 + ' ' + r.player2 + ' ' + r.code).toLowerCase().includes(t));
  box.innerHTML = filtered.slice(0, 12).map(r => {
    const nama = r.player1 + ' / ' + r.player2;
    const laga = M.filter(m => m.p1 === nama || m.p2 === nama).map(card).join('');
    return `<h2>${esc(nama)}</h2><p class="mu">${esc(KATEGORI_LABEL[r.category_code] || r.category_code)} · Group ${esc(r.group_code || '-')} · ${esc(r.code)}</p>` + (laga || '<p class="mu">Belum ada jadwal.</p>');
  }).join('') || '<p class="mu">Pemain tidak ditemukan.</p>';
}

// ====== LOGIKA SPONSOR AUTO-SWITCH ======
function renderSponsor(slideIndex) {
  const titleEl = $('#spons-title');
  const gridEl = $('#spons-grid');
  const dotsEl = $('#spons-dots');
  if (!titleEl || !gridEl || !dotsEl) return;

  const slide = SPONSOR_SLIDES[slideIndex];
  
  // Fade out effect
  gridEl.classList.add('fade-out');
  titleEl.classList.add('fade-out');

  setTimeout(() => {
    titleEl.textContent = slide.title;
    
    // Handle column layout
    gridEl.className = `spons-grid cols-${slide.cols} fade-out`;
    
    // Generate Logo items
    gridEl.innerHTML = slide.logos.map(logo => `
      <div class="spons-item">
        <img src="${logo.src}" alt="${logo.name}" onerror="this.style.opacity=.2">
      </div>
    `).join('');

    // Generate Dots
    dotsEl.innerHTML = SPONSOR_SLIDES.map((_, i) => 
      `<div class="dot ${i === slideIndex ? 'active' : ''}"></div>`
    ).join('');

    // Fade in effect
    gridEl.classList.remove('fade-out');
    titleEl.classList.remove('fade-out');
  }, 300); // 300ms sesuai durasi CSS transition
}

function startSponsorAutoSwitch() {
  if (sponsorInterval) return;
  sponsorInterval = setInterval(() => {
    currentSlide = (currentSlide + 1) % SPONSOR_SLIDES.length;
    renderSponsor(currentSlide);
  }, 5000); // Ganti tiap 5 detik
}

function stopSponsorAutoSwitch() {
  if (sponsorInterval) {
    clearInterval(sponsorInterval);
    sponsorInterval = null;
  }
}
// ==========================================

function render() {
  if (IS_OVERLAY) {
    tab = 'live';
    const nav = $('#nav'); if (nav) nav.style.display = 'none';
    $('#view').innerHTML = V.live();
    return;
  }
  $('#nav').innerHTML = TABS.map(t => '<button class="' + (t[0] === tab ? 'on' : '') + '" data-t="' + t[0] + '">' + t[1] + '</button>').join('');
  
  // Logika Auto-switch Sponsor
  if (tab === 'jadwal') {
    stopSponsorAutoSwitch();
    renderSponsor(0); // Kembalikan ke halaman pertama (Gold Sponsor) jika di jadwal
  } else {
    startSponsorAutoSwitch();
  }

  if (tab === 'cari' && $('#q')) return hasilCari();
  $('#view').innerHTML = V[tab](); 
  if (tab === 'cari') hasilCari();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-t],[data-f]'); if (!el) return; const d = el.dataset;
  if (d.t) { tab = d.t; return render(); }
  
  if (d.f === 'kat') {
    filterKat = d.v;
    render();
  }
});

document.addEventListener('input', e => { if (e.target.id === 'q') { q = e.target.value; hasilCari(); } });

// Render awal & polling
render();
fetchData();
mulaiRealtime();
jadwalkanPoll();
</script>
</body>
